<!DOCTYPE html>
<html>
<head>
  <title>Blocker Settings</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="container small">
    <h1>Blocker Settings</h1>
    
    <div class="form-group">
      <label for="domain">Website Domain (e.g., reddit.com)</label>
      <input type="text" id="domain" placeholder="reddit.com">
    </div>
    
    <div class="form-group">
      <label for="limit">Daily Limit (minutes)</label>
      <input type="number" id="limit" min="0" value="30">
    </div>
    
    <button id="add-btn" class="btn">Add Website</button>
    
    <h2>Blocked Websites</h2>
    <table id="blocked-list">
      <thead>
        <tr>
          <th>Website</th>
          <th>Daily Limit (mins)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Will be populated by JS -->
      </tbody>
    </table>
    
    <hr>
    
    <h2>Backup & Restore</h2>
    <div class="backup-actions">
      <button id="export-btn" class="btn btn-secondary">Export Data (JSON)</button>
      <button id="import-btn-trigger" class="btn btn-secondary">Import Data (JSON)</button>
      <input type="file" id="import-file" accept=".json" style="display: none;">
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
