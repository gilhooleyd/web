<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="../libs/tacit-css.css"/>
    <link rel="stylesheet" href="../common/style.css"/>
    <style>
      /* Custom styles for Pomodoro app */
      body {
        background-color: #fafafa;
        color: #333;
      }
      
      h1, h2, h3 {
        color: #e53935; /* Tomato red for pomodoro theme */
      }
      
      h1:first-child, h2:first-child {
        color: #e53935;
      }
      
      button.btn-primary {
        background-color: #e53935;
        color: white;
      }
      
      button.btn-success {
        background-color: #4caf50;
        color: white;
      }
      
      button.btn-warning {
        background-color: #ff9800;
        color: white;
      }
      
      button.btn-danger {
        background-color: #f44336;
        color: white;
      }

      /* Flex layout for navbar/header */
      .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eaeaea;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
      }

      .nav-container h1 {
        margin: 0;
      }

      /* Timer Dashboard Styling */
      .timer-dashboard {
        display: grid;
        grid-template-columns: 1.2fr 1.8fr;
        gap: 2rem;
        align-items: start;
      }

      @media (max-width: 768px) {
        .timer-dashboard {
          grid-template-columns: 1fr;
        }
      }

      .timer-card {
        text-align: center;
        padding: 3rem 2rem;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        margin-bottom: 1rem;
      }

      .timer-display {
        font-size: 5.5rem;
        font-weight: 700;
        font-family: monospace;
        margin: 1.5rem 0 2.5rem 0;
        color: #222;
        letter-spacing: -2px;
        line-height: 1;
      }

      .timer-controls {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .timer-presets {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .timer-presets button {
        font-size: 0.85rem;
        padding: 0.3rem 0.6rem;
      }

      /* Form Card Styling */
      .form-card {
        padding: 1.5rem;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
      }

      .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: inherit;
        box-sizing: border-box;
      }

      .form-group textarea {
        min-height: 220px;
        resize: vertical;
      }

      .form-help {
        font-size: 0.75rem;
        color: #666;
        margin-top: 0.2rem;
      }

      /* Heatmap Card */
      .heatmap-card {
        padding: 1.5rem;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        margin-bottom: 2rem;
      }

      .heatmap-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .heatmap-header h2 {
        margin: 0;
      }

      .heatmap-legend {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.8rem;
        color: #666;
      }

      .legend-box {
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }

      /* Stats Layout */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      @media (max-width: 768px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }

      .stat-summary-card {
        background: white;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }

      .stat-box {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.8rem 0;
        border-bottom: 1px solid #f0f0f0;
      }

      .stat-box:last-child {
        border-bottom: none;
      }

      .stat-val {
        font-size: 1.5rem;
        font-weight: bold;
        color: #e53935;
      }

      .stat-breakdown-card {
        background: white;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }

      .breakdown-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .breakdown-table th, .breakdown-table td {
        text-align: left;
        padding: 0.6rem 0.8rem;
        border-bottom: 1px solid #f0f0f0;
      }

      .breakdown-table th {
        font-weight: bold;
        color: #666;
      }

      /* Feed Section */
      .feed-section {
        background: white;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        margin-bottom: 3rem;
      }

      .feed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .feed-header h2 {
        margin: 0;
      }

      .filter-controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .filter-controls input, .filter-controls select {
        padding: 0.4rem 0.6rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 0.85rem;
      }

      .feed-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .feed-item {
        border: 1px solid #eaeaea;
        border-radius: 6px;
        padding: 1.25rem;
        background: #fafafa;
        position: relative;
      }

      .feed-item-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.5rem;
      }

      .feed-item-title {
        font-weight: bold;
        font-size: 1.1rem;
        margin: 0;
      }

      .feed-item-meta {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        font-size: 0.75rem;
        border-radius: 20px;
        font-weight: 500;
      }

      .badge-project {
        background-color: #e3f2fd;
        color: #1565c0;
        border: 1px solid #bbdefb;
      }

      .badge-tag {
        background-color: #f1f8e9;
        color: #33691e;
        border: 1px solid #dcedc8;
      }

      .feed-item-time {
        font-size: 0.8rem;
        color: #777;
      }

      .feed-item-info {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #444;
        border-top: 1px dashed #eaeaea;
        padding-top: 0.75rem;
        margin-top: 0.75rem;
      }

      .feed-item-info p {
        margin-bottom: 0.5rem;
      }

      .feed-item-info p:last-child {
        margin-bottom: 0;
      }

      .top-right-btn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: #777;
      }

      /* Dialog / Modal */
      .modal-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        max-width: 450px;
        width: 90%;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        text-align: center;
      }

      .modal-content h3 {
        margin-top: 0;
        color: #4caf50;
      }

      .modal-content p {
        margin-bottom: 1.5rem;
      }

      /* Stats Sidebar Overlay */
      .sidebar-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        justify-content: flex-end;
        z-index: 999;
      }

      .sidebar-content {
        background: white;
        width: 550px;
        max-width: 85%;
        height: 100%;
        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.15);
        padding: 2.5rem 2rem;
        box-sizing: border-box;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eaeaea;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
      }

      .sidebar-header h2 {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app-mount"></main>
  </body>
  <script src="../libs/mithril.js"></script>
  <script src="../libs/snarkdown.js"></script>
  <script src="../common/file-linker.js"></script>
  <script src="../common/heatmap.js"></script>
  <script src="script.js"></script>
</html>
